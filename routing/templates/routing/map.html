<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ plan.start.name }} to {{ plan.finish.name }}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    .summary { position: absolute; top: 12px; right: 12px; z-index: 1000; background: #fff; padding: 12px 16px;
               border-radius: 8px; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="summary">
    <strong>{{ plan.start.name }} &rarr; {{ plan.finish.name }}</strong><br>
    {{ plan.distance_miles }} miles &middot; {{ plan.fuel_stops|length }} fuel stops<br>
    {{ plan.total_gallons }} gal &middot; <strong>${{ plan.total_fuel_cost }}</strong>
  </div>
  {{ plan|json_script:"plan" }}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script>
    const plan = JSON.parse(document.getElementById("plan").textContent);
    const map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
    const line = L.polyline(plan.route.coordinates.map(([lon, lat]) => [lat, lon]), { color: "#2563eb", weight: 4 }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [30, 30] });
    L.marker([plan.start.lat, plan.start.lon]).addTo(map).bindPopup("Start: " + plan.start.name);
    L.marker([plan.finish.lat, plan.finish.lon]).addTo(map).bindPopup("Finish: " + plan.finish.name);
    plan.fuel_stops.forEach((s, i) => {
      L.circleMarker([s.lat, s.lon], { radius: 8, color: "#dc2626", fillOpacity: 0.9 }).addTo(map).bindPopup(
        "<b>Stop " + (i + 1) + ": " + s.name + "</b><br>" + s.city + ", " + s.state + " (mile " + s.mile + ")<br>$" +
        s.price_per_gallon + "/gal &middot; " + s.gallons + " gal &middot; $" + s.cost
      );
    });
  </script>
</body>
</html>
